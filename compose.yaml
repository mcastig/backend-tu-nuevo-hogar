name: tu-nuevo-hogar

# Los tres procesos del bot (Ollama, Llama Stack y la app) mas la descarga inicial de los modelos.
# Solo la app publica un puerto; Ollama y Llama Stack no tienen autenticacion y se quedan en la red interna.
services:
  ollama:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Descarga los modelos en el volumen de Ollama y termina; si ya estan, solo verifica
  ollama-pull:
    image: ollama/ollama
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODELO_CHAT: ${MODELO_CHAT:-ollama/llama3.1:8b}
      MODELO_GUARD: ${MODELO_GUARD:-llama-guard3}
    entrypoint: ["/bin/sh", "-c"]
    command: ['ollama pull "$${MODELO_CHAT#ollama/}" && ollama pull "$$MODELO_GUARD"']

  stack:
    build:
      context: .
      target: stack
    image: tu-nuevo-hogar-stack
    init: true
    restart: unless-stopped
    depends_on:
      # required: false permite apagar el Ollama del contenedor (ver compose.ollama-local.yaml)
      ollama-pull:
        condition: service_completed_successfully
        required: false
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODELO_CHAT: ${MODELO_CHAT:-ollama/llama3.1:8b}
    volumes:
      # Aqui vive el historial de las conversaciones
      - llama-stack:/home/app/.llama
      - huggingface:/home/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8321/v1/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 3m

  app:
    build:
      context: .
      target: app
    image: tu-nuevo-hogar-app
    init: true
    restart: unless-stopped
    depends_on:
      stack:
        condition: service_healthy
    env_file: .env
    # Estas rutas dependen de la red y los volumenes de Compose, asi que mandan sobre lo que diga .env
    environment:
      LLAMA_STACK_URL: http://stack:8321
      OLLAMA_HOST: http://ollama:11434
      DATABASE_PATH: /app/data/bot.sqlite3
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      # Solo en localhost: el acceso publico llega por el tunel o por un proxy inverso con HTTPS
      - "127.0.0.1:${PUERTO_APP:-8000}:8000"
    volumes:
      - datos:/app/data
      - huggingface:/home/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 4
      # El primer arranque descarga el modelo de embeddings y Prompt Guard
      start_period: 5m

  # Tunel de ngrok: `docker compose --profile tunel up -d` (requiere NGROK_AUTHTOKEN en .env).
  # La URL publica sale en `docker compose logs tunel` y en el inspector, http://localhost:4040
  tunel:
    profiles: [tunel]
    image: ngrok/ngrok
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command: http app:8000 --log stdout
    ports:
      - "127.0.0.1:4040:4040"

volumes:
  ollama:
  llama-stack:
  huggingface:
  datos:
